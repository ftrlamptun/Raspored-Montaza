<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raspored Montaža</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0e0f14;
    --surface: #161820;
    --surface2: #1d1f2b;
    --border: #2a2d3e;
    --text: #e8eaf0;
    --text-muted: #6b7080;
    --accent: #7c6af7;
    --r51:  #4fc3f7;
    --r60:  #66bb6a;
    --r48:  #ffa726;
    --rep6: #f06292;
    --rep5: #ab47bc;
    --r41:  #26a69a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BG ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .logo { display: flex; flex-direction: column; gap: 4px; }
  .logo h1 { font-size: clamp(22px, 4vw, 36px); font-weight: 800; letter-spacing: -1px; }
  .logo h1 span { color: var(--accent); }
  .logo p { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px;
    font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all .18s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--accent); background: var(--surface); }
  .legend-item.active { background: var(--surface); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── TABS ── */
  .tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab-btn {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-muted);
    cursor: pointer; transition: all .18s; letter-spacing: .3px;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--accent); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── DAY FILTER ── */
  .day-filter { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
  .day-btn {
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); cursor: pointer; transition: all .18s;
  }
  .day-btn:hover { color: var(--text); }
  .day-btn.active { background: var(--surface2); color: var(--text); border-color: #444; }

  /* ── TABLE WRAPPER ── */
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }

  thead th {
    background: var(--surface);
    padding: 11px 8px;
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    color: var(--text-muted); text-align: center; white-space: nowrap;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  thead th:first-child { text-align: left; padding-left: 16px; min-width: 120px; }

  tbody tr { transition: background .12s; }
  tbody tr:hover td { background: rgba(255,255,255,.025); }

  td {
    padding: 0; text-align: center;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    height: 46px; min-width: 80px; vertical-align: middle;
  }
  td:first-child {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
    text-align: left; padding: 0 16px;
    color: var(--text-muted); background: var(--surface); min-width: 120px;
    white-space: nowrap;
  }
  td.weekend { opacity: .5; }
  td.weekend:first-child { font-style: italic; }

  .cell-inner {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-family: 'DM Mono', monospace; font-size: 11px;
    transition: all .15s; position: relative; min-height: 46px;
    padding: 4px 6px; line-height: 1.3;
  }
  .cell-inner:hover { filter: brightness(1.15); }
  .cell-inner.free { color: transparent; }
  .cell-inner.free:hover { color: rgba(255,255,255,.2); }
  .cell-inner.free:hover::after { content: '+'; font-size: 18px; color: rgba(255,255,255,.3); }
  .cell-inner.booked { font-weight: 500; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; width: 90%; max-width: 400px;
    transform: translateY(20px); transition: transform .2s;
    position: relative;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .modal .meta { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); margin-bottom: 24px; }
  .modal label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .modal input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 10px; border-radius: 8px; font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-danger { background: #c62828; color: #fff; }
  .btn-danger:hover { opacity: .9; }
  .btn-cancel { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-cancel:hover { color: var(--text); }

  .color-strip {
    height: 4px; border-radius: 4px; margin-bottom: 16px;
    transition: background .3s;
  }

  /* ── STATS BAR ── */
  .stats { display: flex; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 18px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-val { font-size: 22px; font-weight: 800; }
  .stat-lbl { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 22px;
    font-family: 'DM Mono', monospace; font-size: 13px;
    transition: transform .3s; z-index: 200; white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <h1>Raspored <span>Montaža</span></h1>
      <p>Fakultetske prostorije · Nedeljni prikaz</p>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="day-filter" id="dayFilter"></div>

  <div class="stats" id="stats"></div>

  <div class="table-wrap">
    <table id="scheduleTable">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="color-strip" id="modalStrip"></div>
    <h2 id="modalTitle">Rezervacija</h2>
    <p class="meta" id="modalMeta"></p>
    <label for="nameInput">Ime / Napomena</label>
    <input type="text" id="nameInput" placeholder="Medigoviceva mala kurva" maxlength="40" autocomplete="off">
    <div style="display:flex;gap:12px;margin-top:14px;">
      <div style="flex:1;">
        <label for="timeFrom" style="margin-bottom:6px;">Od</label>
        <select id="timeFrom" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;outline:none;cursor:pointer;"></select>
      </div>
      <div style="flex:1;">
        <label for="timeTo" style="margin-bottom:6px;">Do</label>
        <select id="timeTo" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;outline:none;cursor:pointer;"></select>
      </div>
    </div>
    <div class="actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ROOMS = [
  { id: "51",  label: "Prostorija 51",  color: "#4fc3f7" },
  { id: "60",  label: "Prostorija 60",  color: "#66bb6a" },
  { id: "48",  label: "Prostorija 48",  color: "#ffa726" },
  { id: "EP6", label: "Prostorija EP6", color: "#f06292" },
  { id: "EP5", label: "Prostorija EP5", color: "#ab47bc" },
  { id: "41",  label: "Prostorija 41",  color: "#26a69a" },
];

const DAYS = ["Ponedeljak","Utorak","Sreda","Četvrtak","Petak","Subota","Nedelja"];
const WEEKEND = [5, 6];
const HOURS = [];
for (let h = 7; h <= 21; h++) HOURS.push(`${String(h).padStart(2,'0')}:00`);

// Storage key per room
const KEY = (room) => `fac_sched_${room}`;

function load(room) {
  try { return JSON.parse(localStorage.getItem(KEY(room))) || {}; }
  catch { return {}; }
}
function save(room, data) {
  localStorage.setItem(KEY(room), JSON.stringify(data));
}
function cellKey(dayIdx, hourIdx) { return `${dayIdx}_${hourIdx}`; }

let currentRoom = ROOMS[0].id;
let visibleDays = new Set(DAYS.map((_,i) => i));

// ── Build legend ──────────────────────────────────────────────────────────────
const legend = document.getElementById('legend');
ROOMS.forEach(r => {
  const el = document.createElement('div');
  el.className = 'legend-item'; el.dataset.room = r.id;
  el.innerHTML = `<span class="legend-dot" style="background:${r.color}"></span>${r.label}`;
  el.onclick = () => { switchRoom(r.id); };
  legend.appendChild(el);
});

// ── Build tabs ────────────────────────────────────────────────────────────────
const tabs = document.getElementById('tabs');
ROOMS.forEach(r => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn'; btn.dataset.room = r.id;
  btn.textContent = r.id;
  btn.onclick = () => switchRoom(r.id);
  tabs.appendChild(btn);
});

// ── Day filter ────────────────────────────────────────────────────────────────
const dayFilter = document.getElementById('dayFilter');
DAYS.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.className = 'day-btn active'; btn.dataset.day = i;
  btn.textContent = d.slice(0,3);
  btn.onclick = () => {
    if (visibleDays.has(i)) visibleDays.delete(i);
    else visibleDays.add(i);
    btn.classList.toggle('active');
    renderTable();
  };
  dayFilter.appendChild(btn);
});

// ── Render table ──────────────────────────────────────────────────────────────
function renderTable() {
  const room = ROOMS.find(r => r.id === currentRoom);
  const data = load(currentRoom);

  // thead
  const thead = document.getElementById('thead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  const th0 = document.createElement('th');
  th0.textContent = 'Dan / Sat';
  tr.appendChild(th0);
  HOURS.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h; tr.appendChild(th);
  });
  thead.appendChild(tr);

  // tbody
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  DAYS.forEach((day, di) => {
    if (!visibleDays.has(di)) return;
    const row = document.createElement('tr');
    const dayTd = document.createElement('td');
    dayTd.textContent = day;
    if (WEEKEND.includes(di)) dayTd.classList.add('weekend');
    row.appendChild(dayTd);

    HOURS.forEach((_, hi) => {
      const td = document.createElement('td');
      if (WEEKEND.includes(di)) td.classList.add('weekend');
      const key = cellKey(di, hi);
      const val = data[key] || '';
      const inner = document.createElement('div');
      inner.className = 'cell-inner ' + (val ? 'booked' : 'free');
      if (val) {
        inner.style.background = hexAlpha(room.color, 0.22);
        inner.style.color = room.color;
        inner.style.borderLeft = `3px solid ${room.color}`;
      }
      inner.textContent = val;
      inner.onclick = () => openModal(currentRoom, di, hi, val, room.color);
      td.appendChild(inner);
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });

  renderStats();
}

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = '';

  let totalBooked = 0;
  ROOMS.forEach(r => {
    const d = load(r.id);
    totalBooked += Object.values(d).filter(v => v).length;
  });
  const data = load(currentRoom);
  const roomBooked = Object.values(data).filter(v => v).length;
  const total = DAYS.length * HOURS.length;
  const pct = Math.round(roomBooked / total * 100);

  const items = [
    { val: HOURS.length, lbl: 'Sati u danu' },
    { val: roomBooked, lbl: 'Zauzeto (ova prostorija)' },
    { val: total - roomBooked, lbl: 'Slobodno (ova prostorija)' },
    { val: pct + '%', lbl: 'Popunjenost' },
  ];
  items.forEach(({val, lbl}) => {
    const el = document.createElement('div');
    el.className = 'stat';
    el.innerHTML = `<span class="stat-val">${val}</span><span class="stat-lbl">${lbl}</span>`;
    statsEl.appendChild(el);
  });
}

// ── Modal ─────────────────────────────────────────────────────────────────────
let modalContext = null;

function populateTimeSelects(fromVal, toVal) {
  const fromSel = document.getElementById('timeFrom');
  const toSel = document.getElementById('timeTo');
  fromSel.innerHTML = '';
  toSel.innerHTML = '';
  HOURS.forEach(h => {
    const o1 = document.createElement('option'); o1.value = h; o1.textContent = h; fromSel.appendChild(o1);
    const o2 = document.createElement('option'); o2.value = h; o2.textContent = h; toSel.appendChild(o2);
  });
  // also add 22:00 as end option
  const last = document.createElement('option'); last.value = '22:00'; last.textContent = '22:00'; toSel.appendChild(last);
  fromSel.value = fromVal || HOURS[0];
  toSel.value = toVal || HOURS[1];
}

function parseEntry(val) {
  // format: "Name [07:00-14:00]"
  const m = val.match(/^(.*)\[(\d{2}:\d{2})-(\d{2}:\d{2})\]$/);
  if (m) return { name: m[1].trim(), from: m[2], to: m[3] };
  return { name: val, from: null, to: null };
}

function openModal(roomId, di, hi, existing, color) {
  modalContext = { roomId, di, hi };
  const room = ROOMS.find(r => r.id === roomId);
  document.getElementById('modalStrip').style.background = color;
  document.getElementById('modalTitle').textContent = existing ? 'Izmeni / Obriši' : 'Nova rezervacija';
  document.getElementById('modalMeta').textContent = `${room.label}  ·  ${DAYS[di]}`;
  const input = document.getElementById('nameInput');
  const parsed = parseEntry(existing);
  input.value = parsed.name;
  populateTimeSelects(parsed.from || HOURS[hi], parsed.to || (HOURS[hi+1] || '22:00'));

  const actions = document.getElementById('modalActions');
  actions.innerHTML = '';

  const save_btn = document.createElement('button');
  save_btn.className = 'btn btn-primary'; save_btn.textContent = existing ? 'Sačuvaj' : 'Rezerviši';
  save_btn.onclick = saveModal;
  actions.appendChild(save_btn);

  if (existing) {
    const del = document.createElement('button');
    del.className = 'btn btn-danger'; del.textContent = 'Obriši';
    del.onclick = deleteModal;
    actions.appendChild(del);
  }

  const cancel = document.createElement('button');
  cancel.className = 'btn btn-cancel'; cancel.textContent = 'Otkaži';
  cancel.onclick = closeModal;
  actions.appendChild(cancel);

  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('open');
  setTimeout(() => input.focus(), 200);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function saveModal() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { showToast('Upiši ime ili napomenu!'); return; }
  const from = document.getElementById('timeFrom').value;
  const to = document.getElementById('timeTo').value;
  if (from >= to) { showToast('„Do" mora biti posle „Od"!'); return; }
  const val = `${name} [${from}-${to}]`;
  const { roomId, di } = modalContext;
  const data = load(roomId);

  // clear all old keys for this day that might be covered
  Object.keys(data).forEach(k => { if (k.startsWith(`${di}_`)) delete data[k]; });

  // mark every hour slot in the range
  const fromIdx = HOURS.indexOf(from);
  const toIdx = HOURS.indexOf(to); // exclusive end
  const endIdx = toIdx === -1 ? HOURS.length : toIdx;
  for (let i = fromIdx; i < endIdx; i++) {
    if (i >= 0) data[cellKey(di, i)] = val;
  }

  save(roomId, data);
  closeModal();
  renderTable();
  showToast('✓  Rezervacija sačuvana');
}

function deleteModal() {
  const { roomId, di, hi } = modalContext;
  const data = load(roomId);
  const val = data[cellKey(di, hi)];
  // Remove all slots with same value on same day
  Object.keys(data).forEach(k => {
    if (k.startsWith(`${di}_`) && data[k] === val) delete data[k];
  });
  save(roomId, data);
  closeModal();
  renderTable();
  showToast('Rezervacija obrisana');
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveModal();
  if (e.key === 'Escape') closeModal();
});

// ── Switch room ───────────────────────────────────────────────────────────────
function switchRoom(id) {
  currentRoom = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.room === id));
  document.querySelectorAll('.legend-item').forEach(b => b.classList.toggle('active', b.dataset.room === id));
  renderTable();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ──────────────────────────────────────────────────────────────────────
switchRoom(ROOMS[0].id);
</script>
</body>
</html>
