<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Raspored Montaža</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0e0f14;
    --surface: #161820;
    --surface2: #1d1f2b;
    --border: #2a2d3e;
    --text: #e8eaf0;
    --text-muted: #6b7080;
    --accent: #7c6af7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .logo { display: flex; flex-direction: column; gap: 4px; }
  .logo h1 { font-size: clamp(20px, 5vw, 36px); font-weight: 800; letter-spacing: -1px; }
  .logo h1 span { color: var(--accent); }
  .logo p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .sync-status {
    font-family: 'DM Mono', monospace; font-size: 11px;
    display: flex; align-items: center; gap: 6px;
    color: var(--text-muted);
  }
  .sync-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #555; transition: background .3s;
  }
  .sync-dot.ok { background: #66bb6a; }
  .sync-dot.syncing { background: #ffa726; animation: pulse .8s infinite; }
  .sync-dot.err { background: #f06292; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px;
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all .18s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--accent); background: var(--surface); }
  .legend-item.active { background: var(--surface); border-color: #555; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* ── TABS ── */
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-muted);
    cursor: pointer; transition: all .18s; letter-spacing: .3px;
    min-height: 40px;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--accent); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── DAY FILTER ── */
  .day-filter { display: flex; gap: 5px; margin-bottom: 18px; flex-wrap: wrap; }
  .day-btn {
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); cursor: pointer; transition: all .18s;
    min-height: 36px; min-width: 44px;
  }
  .day-btn:hover { color: var(--text); }
  .day-btn.active { background: var(--surface2); color: var(--text); border-color: #444; }

  /* ── TABLE WRAPPER ── */
  .table-wrap {
    overflow-x: auto; border-radius: 12px; border: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }

  thead th {
    background: var(--surface);
    padding: 10px 6px;
    font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
    color: var(--text-muted); text-align: center; white-space: nowrap;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    position: sticky; top: 0; z-index: 2;
  }
  thead th:first-child { text-align: left; padding-left: 12px; min-width: 100px; }

  tbody tr { transition: background .12s; }
  tbody tr:hover td { background: rgba(255,255,255,.018); }

  td {
    padding: 0; text-align: center;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    height: 44px; min-width: 70px; vertical-align: middle;
    position: relative;
  }
  td:first-child {
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600;
    text-align: left; padding: 0 12px;
    color: var(--text-muted); background: var(--surface); min-width: 100px;
    white-space: nowrap; position: sticky; left: 0; z-index: 1;
  }
  td.weekend { opacity: .5; }
  td.weekend:first-child { font-style: italic; }

  /* merged booking block */
  .booking-block {
    position: absolute;
    top: 3px; bottom: 3px; left: 3px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    overflow: hidden;
    transition: filter .15s;
    z-index: 1;
    padding: 2px 8px;
  }
  .booking-block:hover { filter: brightness(1.2); }
  .booking-block-text {
    font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: center; line-height: 1.2;
  }

  /* free cell */
  .cell-free {
    width: 100%; height: 100%; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .12s;
    position: relative;
  }
  .cell-free:hover { background: rgba(124,106,247,.08); }
  .cell-free:hover::after {
    content: '+'; font-size: 16px; color: rgba(255,255,255,.25);
    font-family: 'Syne', sans-serif; font-weight: 700;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
    padding: 16px;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 400px;
    transform: translateY(20px); transition: transform .2s;
    position: relative;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .modal .meta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); margin-bottom: 22px; }
  .modal label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
  .modal input, .modal select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px; outline: none;
    transition: border-color .15s; appearance: none;
  }
  .modal input:focus, .modal select:focus { border-color: var(--accent); }
  .modal .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 80px; padding: 11px 10px; border-radius: 8px;
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; border: none; transition: all .15s; min-height: 44px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-danger { background: #c62828; color: #fff; }
  .btn-danger:hover { opacity: .9; }
  .btn-cancel { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-cancel:hover { color: var(--text); }

  .color-strip { height: 4px; border-radius: 4px; margin-bottom: 16px; transition: background .3s; }

  /* ── STATS BAR ── */
  .stats { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px;
    display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 100px;
  }
  .stat-val { font-size: 20px; font-weight: 800; }
  .stat-lbl { font-size: 10px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 20px;
    font-family: 'DM Mono', monospace; font-size: 12px;
    transition: transform .3s; z-index: 200; white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── LOADING OVERLAY ── */
  .loading-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform .3s; z-index: 300;
  }
  .loading-bar.active { transform: scaleX(0.7); }
  .loading-bar.done { transform: scaleX(1); opacity: 0; transition: transform .2s, opacity .3s .2s; }

  /* ── MOBILE TWEAKS ── */
  @media (max-width: 600px) {
    .wrap { padding: 14px 10px 60px; }
    header { margin-bottom: 18px; }
    .header-right { align-items: flex-start; }
    .legend { justify-content: flex-start; }
    .stats { gap: 6px; }
    .stat { padding: 8px 12px; }
    .stat-val { font-size: 17px; }
    .tabs { gap: 5px; }
    .tab-btn { padding: 7px 12px; font-size: 12px; }
    .modal { padding: 22px 16px; }
  }

  /* time selects row */
  .time-row { display: flex; gap: 10px; margin-top: 14px; }
  .time-col { flex: 1; }
  .time-col label { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="loading-bar" id="loadingBar"></div>
<div class="wrap">

  <header>
    <div class="logo">
      <h1>Raspored <span>Montaža</span></h1>
      <p>Fakultetske prostorije · Nedeljni prikaz</p>
    </div>
    <div class="header-right">
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">Učitavanje...</span>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="day-filter" id="dayFilter"></div>
  <div class="stats" id="stats"></div>

  <div class="table-wrap">
    <table id="scheduleTable">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="color-strip" id="modalStrip"></div>
    <h2 id="modalTitle">Rezervacija</h2>
    <p class="meta" id="modalMeta"></p>
    <label for="nameInput">Ime / Napomena</label>
    <input type="text" id="nameInput" placeholder="Medigoviceva mala kurva" maxlength="40" autocomplete="off">
    <div class="time-row">
      <div class="time-col">
        <label for="timeFrom">Od</label>
        <select id="timeFrom"></select>
      </div>
      <div class="time-col">
        <label for="timeTo">Do</label>
        <select id="timeTo"></select>
      </div>
    </div>
    <div class="actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const ROOMS = [
  { id: "51",  label: "Prostorija 51",  color: "#4fc3f7" },
  { id: "60",  label: "Prostorija 60",  color: "#66bb6a" },
  { id: "48",  label: "Prostorija 48",  color: "#ffa726" },
  { id: "EP6", label: "Prostorija EP6", color: "#f06292" },
  { id: "EP5", label: "Prostorija EP5", color: "#ab47bc" },
  { id: "41",  label: "Prostorija 41",  color: "#26a69a" },
];

const DAYS = ["Ponedeljak","Utorak","Sreda","Četvrtak","Petak","Subota","Nedelja"];
const WEEKEND = [5, 6];
const HOURS = [];
for (let h = 7; h <= 21; h++) HOURS.push(`${String(h).padStart(2,'0')}:00`);

let currentRoom = ROOMS[0].id;
let visibleDays = new Set(DAYS.map((_,i) => i));

// ── Shared Storage (window.storage) ──────────────────────────────────────────
// Keyed per room, shared=true so everyone sees the same data

const STORAGE_KEY = (room) => `montaza_room_${room}`;

async function loadShared(room) {
  try {
    const res = await window.storage.get(STORAGE_KEY(room), true);
    if (res && res.value) return JSON.parse(res.value);
    return {};
  } catch {
    return {};
  }
}

async function saveShared(room, data) {
  try {
    await window.storage.set(STORAGE_KEY(room), JSON.stringify(data), true);
    return true;
  } catch {
    return false;
  }
}

// In-memory cache so rendering is fast
let roomCache = {};

async function initCache() {
  setSyncState('syncing', 'Učitavanje...');
  showLoadingBar();
  try {
    for (const r of ROOMS) {
      roomCache[r.id] = await loadShared(r.id);
    }
    setSyncState('ok', 'Sinhronizovano');
  } catch {
    setSyncState('err', 'Greška veze');
  }
  hideLoadingBar();
}

function getCached(roomId) {
  return roomCache[roomId] || {};
}

async function persistRoom(roomId, data) {
  roomCache[roomId] = data;
  setSyncState('syncing', 'Čuvanje...');
  const ok = await saveShared(roomId, data);
  setSyncState(ok ? 'ok' : 'err', ok ? 'Sinhronizovano' : 'Greška čuvanja');
}

// ── Sync state UI ─────────────────────────────────────────────────────────────
function setSyncState(state, label) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className = 'sync-dot ' + state;
  lbl.textContent = label;
}

// ── Loading bar ───────────────────────────────────────────────────────────────
function showLoadingBar() {
  const b = document.getElementById('loadingBar');
  b.className = 'loading-bar active';
}
function hideLoadingBar() {
  const b = document.getElementById('loadingBar');
  b.className = 'loading-bar done';
  setTimeout(() => { b.className = 'loading-bar'; }, 600);
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function cellKey(dayIdx, hourIdx) { return `${dayIdx}_${hourIdx}`; }

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function parseEntry(val) {
  const m = val && val.match(/^(.*)\[(\d{2}:\d{2})-(\d{2}:\d{2})\]$/);
  if (m) return { name: m[1].trim(), from: m[2], to: m[3] };
  return { name: val || '', from: null, to: null };
}

// ── Build legend ──────────────────────────────────────────────────────────────
const legend = document.getElementById('legend');
ROOMS.forEach(r => {
  const el = document.createElement('div');
  el.className = 'legend-item'; el.dataset.room = r.id;
  el.innerHTML = `<span class="legend-dot" style="background:${r.color}"></span>${r.label}`;
  el.onclick = () => switchRoom(r.id);
  legend.appendChild(el);
});

// ── Build tabs ────────────────────────────────────────────────────────────────
const tabs = document.getElementById('tabs');
ROOMS.forEach(r => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn'; btn.dataset.room = r.id;
  btn.textContent = r.id;
  btn.onclick = () => switchRoom(r.id);
  tabs.appendChild(btn);
});

// ── Day filter ────────────────────────────────────────────────────────────────
const dayFilter = document.getElementById('dayFilter');
DAYS.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.className = 'day-btn active'; btn.dataset.day = i;
  btn.textContent = d.slice(0,3);
  btn.onclick = () => {
    if (visibleDays.has(i)) visibleDays.delete(i);
    else visibleDays.add(i);
    btn.classList.toggle('active');
    renderTable();
  };
  dayFilter.appendChild(btn);
});

// ── Render table ──────────────────────────────────────────────────────────────
function renderTable() {
  const room = ROOMS.find(r => r.id === currentRoom);
  const data = getCached(currentRoom);

  // thead
  const thead = document.getElementById('thead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  const th0 = document.createElement('th');
  th0.textContent = 'Dan / Sat';
  tr.appendChild(th0);
  HOURS.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h; tr.appendChild(th);
  });
  thead.appendChild(tr);

  // tbody — build with merged cells (colspan)
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  DAYS.forEach((day, di) => {
    if (!visibleDays.has(di)) return;
    const row = document.createElement('tr');

    const dayTd = document.createElement('td');
    dayTd.textContent = day;
    if (WEEKEND.includes(di)) dayTd.classList.add('weekend');
    row.appendChild(dayTd);

    let hi = 0;
    while (hi < HOURS.length) {
      const key = cellKey(di, hi);
      const val = data[key] || '';

      if (val) {
        // Find how many consecutive slots share this same value
        let span = 1;
        while (
          hi + span < HOURS.length &&
          data[cellKey(di, hi + span)] === val
        ) span++;

        const td = document.createElement('td');
        td.colSpan = span;
        if (WEEKEND.includes(di)) td.classList.add('weekend');

        const parsed = parseEntry(val);
        const block = document.createElement('div');
        block.className = 'booking-block';
        // Width calculated from colspan — leave 6px gap
        block.style.right = '3px'; // matches left offset so it fills cell
        block.style.background = hexAlpha(room.color, 0.22);
        block.style.borderLeft = `3px solid ${room.color}`;

        const txt = document.createElement('div');
        txt.className = 'booking-block-text';
        txt.style.color = room.color;
        // Show name + time range
        txt.textContent = span > 1
          ? `${parsed.name}  ${parsed.from}–${parsed.to}`
          : parsed.name;
        txt.title = `${parsed.name}  ${parsed.from || ''}–${parsed.to || ''}`;

        block.appendChild(txt);
        block.onclick = () => openModal(currentRoom, di, hi, val, room.color);
        td.appendChild(block);
        row.appendChild(td);
        hi += span;
      } else {
        const td = document.createElement('td');
        if (WEEKEND.includes(di)) td.classList.add('weekend');
        const free = document.createElement('div');
        free.className = 'cell-free';
        free.onclick = () => openModal(currentRoom, di, hi, '', room.color);
        td.appendChild(free);
        row.appendChild(td);
        hi++;
      }
    }

    tbody.appendChild(row);
  });

  renderStats();
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = '';

  const data = getCached(currentRoom);

  // Count unique bookings (not slots) for this room
  const uniqueBookings = new Set();
  Object.entries(data).forEach(([k, v]) => {
    if (v) {
      const [di] = k.split('_');
      uniqueBookings.add(`${di}_${v}`);
    }
  });

  const slotsBooked = Object.values(data).filter(v => v).length;
  const total = DAYS.length * HOURS.length;
  const pct = Math.round(slotsBooked / total * 100);

  const items = [
    { val: HOURS.length, lbl: 'Sati u danu' },
    { val: uniqueBookings.size, lbl: 'Rezervacija' },
    { val: slotsBooked, lbl: 'Zauzeto sati' },
    { val: pct + '%', lbl: 'Popunjenost' },
  ];
  items.forEach(({val, lbl}) => {
    const el = document.createElement('div');
    el.className = 'stat';
    el.innerHTML = `<span class="stat-val">${val}</span><span class="stat-lbl">${lbl}</span>`;
    statsEl.appendChild(el);
  });
}

// ── Modal ─────────────────────────────────────────────────────────────────────
let modalContext = null;

function populateTimeSelects(fromVal, toVal) {
  const fromSel = document.getElementById('timeFrom');
  const toSel = document.getElementById('timeTo');
  fromSel.innerHTML = '';
  toSel.innerHTML = '';
  HOURS.forEach(h => {
    const o1 = document.createElement('option'); o1.value = h; o1.textContent = h; fromSel.appendChild(o1);
    const o2 = document.createElement('option'); o2.value = h; o2.textContent = h; toSel.appendChild(o2);
  });
  const last = document.createElement('option'); last.value = '22:00'; last.textContent = '22:00'; toSel.appendChild(last);
  fromSel.value = fromVal || HOURS[0];
  toSel.value = toVal || HOURS[1] || '22:00';
}

function openModal(roomId, di, hi, existing, color) {
  modalContext = { roomId, di, hi };
  const room = ROOMS.find(r => r.id === roomId);
  document.getElementById('modalStrip').style.background = color;
  document.getElementById('modalTitle').textContent = existing ? 'Izmeni / Obriši' : 'Nova rezervacija';
  document.getElementById('modalMeta').textContent = `${room.label}  ·  ${DAYS[di]}`;
  const input = document.getElementById('nameInput');
  const parsed = parseEntry(existing);
  input.value = parsed.name;
  populateTimeSelects(parsed.from || HOURS[hi], parsed.to || (HOURS[hi+1] || '22:00'));

  const actions = document.getElementById('modalActions');
  actions.innerHTML = '';

  const save_btn = document.createElement('button');
  save_btn.className = 'btn btn-primary'; save_btn.textContent = existing ? 'Sačuvaj' : 'Rezerviši';
  save_btn.onclick = saveModal;
  actions.appendChild(save_btn);

  if (existing) {
    const del = document.createElement('button');
    del.className = 'btn btn-danger'; del.textContent = 'Obriši';
    del.onclick = deleteModal;
    actions.appendChild(del);
  }

  const cancel = document.createElement('button');
  cancel.className = 'btn btn-cancel'; cancel.textContent = 'Otkaži';
  cancel.onclick = closeModal;
  actions.appendChild(cancel);

  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => input.focus(), 200);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

async function saveModal() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { showToast('Upiši ime ili napomenu!'); return; }
  const from = document.getElementById('timeFrom').value;
  const to = document.getElementById('timeTo').value;
  if (from >= to) { showToast('„Do" mora biti posle „Od"!'); return; }
  const val = `${name} [${from}-${to}]`;
  const { roomId, di, hi } = modalContext;
  const data = getCached(roomId);

  // If editing, first remove the OLD booking's slots on this day
  const oldVal = data[cellKey(di, hi)];
  if (oldVal) {
    Object.keys(data).forEach(k => {
      if (k.startsWith(`${di}_`) && data[k] === oldVal) delete data[k];
    });
  }

  // Mark every hour slot in the new range
  const fromIdx = HOURS.indexOf(from);
  const toIdx = HOURS.indexOf(to);
  const endIdx = toIdx === -1 ? HOURS.length : toIdx;
  for (let i = fromIdx; i < endIdx; i++) {
    if (i >= 0) data[cellKey(di, i)] = val;
  }

  closeModal();
  renderTable(); // optimistic update
  const ok = await persistRoom(roomId, data);
  showToast(ok !== false ? '✓  Rezervacija sačuvana' : '⚠ Greška čuvanja');
}

async function deleteModal() {
  const { roomId, di, hi } = modalContext;
  const data = { ...getCached(roomId) }; // copy to avoid mutation issues
  const val = data[cellKey(di, hi)];
  if (val) {
    Object.keys(data).forEach(k => {
      if (k.startsWith(`${di}_`) && data[k] === val) delete data[k];
    });
  }
  roomCache[roomId] = data; // update cache immediately
  closeModal();
  renderTable(); // optimistic update
  const ok = await saveShared(roomId, data);
  setSyncState(ok ? 'ok' : 'err', ok ? 'Sinhronizovano' : 'Greška čuvanja');
  showToast(ok ? 'Rezervacija obrisana' : '⚠ Greška brisanja');
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveModal();
  if (e.key === 'Escape') closeModal();
});

// ── Switch room ───────────────────────────────────────────────────────────────
function switchRoom(id) {
  currentRoom = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.room === id));
  document.querySelectorAll('.legend-item').forEach(b => b.classList.toggle('active', b.dataset.room === id));
  renderTable();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Auto-refresh every 30s to pick up changes from other users ────────────────
async function syncFromServer() {
  try {
    setSyncState('syncing', 'Osvežavanje...');
    for (const r of ROOMS) {
      roomCache[r.id] = await loadShared(r.id);
    }
    setSyncState('ok', 'Sinhronizovano');
    renderTable();
  } catch {
    setSyncState('err', 'Greška veze');
  }
}

setInterval(syncFromServer, 30000);

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  await initCache();
  switchRoom(ROOMS[0].id);
})();
</script>
